# ==============================================================================
# Navo AI - Production Nginx Konfiguratsiyasi
# Ushbu faylni /etc/nginx/sites-available/navo-ai manziliga ko'chiring va
# /etc/nginx/sites-enabled/ ga simvolik havola (symlink) yarating:
# sudo ln -s /etc/nginx/sites-available/navo-ai /etc/nginx/sites-enabled/
# 'yourdomain.com' o'rniga o'zingizning haqiqiy domeningizni yozing.
# ==============================================================================

# 1. HTTP so'rovlarni majburiy HTTPS ga yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt tekshiruv fayllari uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Asosiy HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Sertifikatlari (Let's Encrypt / Certbot tomonidan yaratiladi)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL xavfsizlik protokollari va shifrlash usullari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Fayl yuklash hajmi chegarasi (Hujjat va audio yuklash uchun 25MB)
    client_max_body_size 25M;

    # Gzip siqish (Sahifalar tezroq yuklanishi uchun)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik fayllarni brauzerda keshlashtirish
    location /assets/ {
        proxy_pass http://127.0.0.1:5507/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Barcha so'rovlarni FastAPI backend serveriga uzatish
    location / {
        proxy_pass http://127.0.0.1:5507;
        proxy_http_version 1.1;

        # WebSocket qo'llab-quvvatlashi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Reverse Proxy sarlavhalari (FastAPI cookies va auth uchun o'ta muhim)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout sozlamalari (AI uzoq o'ylaganda uzilib qolmasligi uchun)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buferlash sozlamalari
        proxy_buffering off;
        proxy_redirect off;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Navo AI">
  <defs>
    <linearGradient id="navoTile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2545" />
      <stop offset=".55" stop-color="#1b1830" />
      <stop offset="1" stop-color="#131124" />
    </linearGradient>
    <linearGradient id="navoFrame" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a99bfa" />
      <stop offset=".5" stop-color="#7b6bee" />
      <stop offset="1" stop-color="#b09cff" />
    </linearGradient>
    <linearGradient id="navoLetter" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".5" stop-color="#dccdff" />
      <stop offset="1" stop-color="#9b84f2" />
    </linearGradient>
    <linearGradient id="navoLeaf" x1="36" y1="30" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbb9ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="navoGlow" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b6bee" stop-opacity=".34" />
      <stop offset="1" stop-color="#7b6bee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="16" fill="url(#navoTile)" stroke="#8b7ce8" stroke-opacity=".45" stroke-width="1.1" />
  <rect x="4.6" y="4.6" width="54.8" height="54.8" rx="13" fill="url(#navoGlow)" />

  <!-- Oktetam ramka -->
  <path d="M20.5 7.5h23L56.5 20.5v23L43.5 56.5h-23L7.5 43.5v-23L20.5 7.5Z" fill="none" stroke="url(#navoFrame)" stroke-width="2.3" stroke-linejoin="round" opacity=".95" />
  <!-- Ramka ichidagi burchak tarmoqlari va tugunlar -->
  <g stroke="url(#navoFrame)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".95">
    <path d="M14.5 14.5 20.5 8.5M14.5 14.5 8.5 20.5" />
    <path d="M49.5 14.5 43.5 8.5M49.5 14.5 55.5 20.5" />
    <path d="M14.5 49.5 20.5 55.5M14.5 49.5 8.5 43.5" />
    <path d="M49.5 49.5 43.5 55.5M49.5 49.5 55.5 43.5" />
  </g>
  <g fill="#241f3d" stroke="url(#navoFrame)" stroke-width="1.4">
    <circle cx="14.5" cy="14.5" r="1.9" />
    <circle cx="49.5" cy="14.5" r="1.9" />
    <circle cx="14.5" cy="49.5" r="1.9" />
    <circle cx="49.5" cy="49.5" r="1.9" />
  </g>
  <!-- Chap va o'ng chetdagi ichkariga qaragan uchburchak kesiklar -->
  <path d="M7.5 25.5 13 32 7.5 38.5Z" fill="#1b1830" stroke="url(#navoFrame)" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M56.5 25.5 51 32 56.5 38.5Z" fill="#1b1830" stroke="url(#navoFrame)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- N harfi -->
  <g fill="none" stroke="url(#navoLetter)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.5 46V19.5" />
    <path d="M21.5 20.5 42.5 45.5" />
    <path d="M42.5 45V20.5" />
  </g>
  <!-- Harf ustidagi kontakt nuqtalari -->
  <g fill="#e9e1ff">
    <circle cx="21.5" cy="19.5" r="1.35" />
    <circle cx="42.5" cy="45" r="1.35" />
    <circle cx="31.5" cy="33" r="1.1" opacity=".85" />
  </g>

  <!-- Barg -->
  <g>
    <path d="M40.2 29.4c1-8.4 6.1-14.2 13.4-16.1.8 8.6-4.5 15.7-13.4 16.1Z" fill="url(#navoLeaf)" />
    <path d="M41.6 28.2c2.9-3.9 6.3-7.6 9.6-10.8" fill="none" stroke="#7b6bee" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round" />
    <path d="M39.4 30.4 35.6 35.6" fill="none" stroke="url(#navoLeaf)" stroke-width="1.9" stroke-linecap="round" />
